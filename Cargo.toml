[workspace]
resolver = "3"
members = [
    "crates/jsm-cli",
    "crates/jsm-core",
    "crates/jsm-registry",
    "crates/jsm-resolver",
    "crates/jsm-store",
    "crates/jsm-fetch",
    "crates/jsm-linker",
    "crates/jsm-build",
    "crates/jsm-lockfile",
    "crates/jsm-workspace",
    "crates/jsm-security",
    "crates/jsm-daemon",
    "crates/jsm-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.0"
miette = { version = "7.6", features = ["fancy"] }
proptest = "1.6"
rand = "0.8"
regex = "1.11"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.14"
thiserror = "2.0"
tiny_http = "0.12"
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = "2.12"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
